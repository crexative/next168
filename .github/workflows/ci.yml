name: CI

on:
  pull_request:
    branches: ['feature/#3-local-first-next168']
  push:
    branches: ['feature/#3-local-first-next168']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build

      - name: Install companion
        run: npm --prefix companion ci

      - name: Type-check and test companion
        run: npm --prefix companion test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install companion
        run: npm --prefix companion ci

      - name: Read locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A stalled apt mirror connection otherwise hangs the browser dependency install until the step limit.
      - name: Bound apt network waits
        run: echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit || npx playwright install --with-deps chromium webkit

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium webkit || npx playwright install-deps chromium webkit

      - name: End-to-end tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: |
            e2e/artifacts
            e2e/.report
            e2e/.results
          if-no-files-found: ignore
          retention-days: 14

  # The single required check keeps its name: branch tooling looks for `verify`.
  verify:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks and every e2e shard to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          echo "e2e: $E2E_RESULT"
          [ "$CHECKS_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ]
